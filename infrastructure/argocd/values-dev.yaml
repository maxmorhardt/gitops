global:
  domain: argocd.dev.maxhq.io

configs:
  params:
    controller.repo.server.timeout.seconds: 180
    server.repo.server.timeout.seconds: 180
  cm:
    oidc.config: |
      name: maxhq
      issuer: https://login.dev.maxhq.io
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      cliClientID: argocd-cli
      requestedScopes:
        - openid
        - profile
        - email
        - offline_access

server:
  httproute:
    hostnames:
      - argocd.dev.maxhq.io

notifications:
  context:
    cluster: dev
