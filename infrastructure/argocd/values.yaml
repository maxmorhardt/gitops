global:
  domain: argocd.maxhq.io

configs:
  params:
    server.insecure: true
    application.namespaces: argocd
  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
    timeout.reconciliation: 180s
    kustomize.buildOptions: --enable-helm
    oidc.config: |
      name: maxhq
      issuer: https://login.maxhq.io
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      cliClientID: argocd-cli
      requestedScopes:
        - openid
        - profile
        - email
        - offline_access
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - '*'
  rbac:
    policy.default: ''
    scopes: '[email]'
    policy.csv: |
      g, maxmorhardt13@gmail.com, role:admin
  repositories:
    charts:
      name: charts
      type: helm
      url: ghcr.io/maxmorhardt/charts
      enableOCI: 'true'
    envoyproxy:
      name: envoyproxy
      type: helm
      url: docker.io/envoyproxy
      enableOCI: 'true'
    cloudpirates:
      name: cloudpirates
      type: helm
      url: docker.io/cloudpirates
      enableOCI: 'true'

crds:
  install: true
  keep: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s

server:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
  httproute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: maxhq
        namespace: envoy-gateway-system
    hostnames:
      - argocd.maxhq.io
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

applicationSet:
  replicas: 0

notifications:
  enabled: true
  context:
    cluster: prod
    telegramChatId: '8753214944'
  secret:
    create: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  notifiers:
    service.webhook.telegram: |
      url: $telegram-url
      headers:
        - name: Content-Type
          value: application/json
  subscriptions:
    - recipients:
        - telegram
      triggers:
        - on-health-degraded
        - on-sync-failed
  triggers:
    trigger.on-health-degraded: |
      - description: Degraded for 10 minutes, so a rollout that's still starting stays quiet
        send: [app-health-degraded]
        when: app.status.health.status == 'Degraded' and time.Now().Sub(time.Parse(app.status.health.lastTransitionTime)).Minutes() >= 10
    trigger.on-sync-failed: |
      - description: Sync failed
        send: [app-sync-failed]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
  templates:
    template.app-health-degraded: |
      webhook:
        telegram:
          method: POST
          path: /sendMessage
          body: |
            {"chat_id": "{{.context.telegramChatId}}", "link_preview_options": {"is_disabled": true}, "text": {{printf "[%s] %s has been degraded for 10 minutes (%s/applications/%s)" .context.cluster .app.metadata.name .context.argocdUrl .app.metadata.name | toJson}}}
    template.app-sync-failed: |
      webhook:
        telegram:
          method: POST
          path: /sendMessage
          body: |
            {"chat_id": "{{.context.telegramChatId}}", "link_preview_options": {"is_disabled": true}, "text": {{printf "[%s] Sync failed for %s: %s (%s/applications/%s)" .context.cluster .app.metadata.name (.app.status.operationState.message | trunc 300) .context.argocdUrl .app.metadata.name | toJson}}}

dex:
  enabled: false

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s

# only signed-in, allowed users reach Argo CD at all; its own SSO and RBAC still apply behind this
extraObjects:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    metadata:
      name: argocd-gate
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: argocd-server
      oidc:
        provider:
          issuer: https://login.maxhq.io
          authorizationEndpoint: https://login.maxhq.io/auth?connector_id=google
        clientID: argocd-gate
        clientSecret:
          name: argocd-gate-oidc
        redirectURL: https://argocd.maxhq.io/oauth2/callback
        logoutPath: /oauth2/logout
        scopes:
          - profile
          - email
        cookieNames:
          idToken: argocd-gate-id-token
      jwt:
        providers:
          - name: dex
            issuer: https://login.maxhq.io
            remoteJWKS:
              uri: https://login.maxhq.io/keys
            extractFrom:
              cookies:
                - argocd-gate-id-token
      authorization:
        defaultAction: Deny
        rules:
          - name: allow-admins
            action: Allow
            principal:
              jwt:
                provider: dex
                claims:
                  - name: email
                    values:
                      - maxmorhardt13@gmail.com
