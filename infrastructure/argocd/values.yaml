global:
  domain: argocd.maxhq.io

configs:
  params:
    server.insecure: true
    application.namespaces: argocd
  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
    timeout.reconciliation: 180s
    kustomize.buildOptions: --enable-helm
    oidc.config: |
      name: maxhq
      issuer: https://login.maxhq.io
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      cliClientID: argocd-cli
      requestedScopes:
        - openid
        - profile
        - email
        - offline_access
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - '*'
  rbac:
    policy.default: ''
    scopes: '[email]'
    policy.csv: |
      g, maxmorhardt13@gmail.com, role:admin
  repositories:
    charts:
      name: charts
      type: helm
      url: ghcr.io/maxmorhardt/charts
      enableOCI: 'true'
    envoyproxy:
      name: envoyproxy
      type: helm
      url: docker.io/envoyproxy
      enableOCI: 'true'
    cloudpirates:
      name: cloudpirates
      type: helm
      url: docker.io/cloudpirates
      enableOCI: 'true'

crds:
  install: true
  keep: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  httproute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: maxhq
        namespace: envoy-gateway-system
    hostnames:
      - argocd.maxhq.io
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

applicationSet:
  replicas: 0

notifications:
  enabled: true
  secret:
    create: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  notifiers:
    service.webhook.discord: |
      url: $discord-webhook-url
      headers:
        - name: Content-Type
          value: application/json
  subscriptions:
    - recipients:
        - discord
      triggers:
        - on-deployed
        - on-health-degraded
        - on-sync-failed
  triggers:
    trigger.on-deployed: |
      - description: Synced and healthy, once per revision
        oncePer: app.status.operationState?.syncResult?.revision
        send: [app-deployed]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
    trigger.on-health-degraded: |
      - description: Health went degraded
        send: [app-health-degraded]
        when: app.status.health.status == 'Degraded'
    trigger.on-sync-failed: |
      - description: Sync failed
        send: [app-sync-failed]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
  templates:
    template.app-deployed: |
      webhook:
        discord:
          method: POST
          body: |
            {"content": "Deployed **{{.app.metadata.name}}** at `{{.app.status.sync.revision | trunc 7}}` ({{.context.argocdUrl}}/applications/{{.app.metadata.name}})"}
    template.app-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {"content": "**{{.app.metadata.name}}** is degraded ({{.context.argocdUrl}}/applications/{{.app.metadata.name}})"}
    template.app-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {"content": "Sync failed for **{{.app.metadata.name}}**: {{.app.status.operationState.message | trunc 300}} ({{.context.argocdUrl}}/applications/{{.app.metadata.name}})"}

dex:
  enabled: false

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
