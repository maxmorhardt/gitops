fullnameOverride: valkey

architecture: replication
replicaCount: 3

auth:
  existingSecret: valkey-users
  existingSecretPasswordKey: default

config:
  maxMemory: 160mb
  maxMemoryPolicy: volatile-ttl
  save: ""
  extraConfig:
    - appendonly yes
    - appendfsync always
    - min-replicas-to-write 1
    - min-replicas-max-lag 10
    - "user squares on #d85e6a7a3d22aadd139137e12828b655cb0e9d1a71e9c62008610f59b21a1d1e ~squares:* resetchannels +@all -@dangerous"

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 256Mi

persistence:
  storageClass: local-path-retain
  size: 2Gi

pdb:
  enabled: true
  minAvailable: 2

terminationGracePeriodSeconds: 60

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: valkey

sentinel:
  enabled: true
  masterName: valkey
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  masterProxy:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  serviceMonitor:
    enabled: true
