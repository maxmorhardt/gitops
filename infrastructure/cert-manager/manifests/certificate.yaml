apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dev-maxhq-io
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: dev.maxhq.io-tls
  dnsNames:
    - dev.maxhq.io
    - '*.dev.maxhq.io'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
