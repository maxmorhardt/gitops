apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: squares-contests
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: squares
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: squares-contests
    targetRevision: 0.0.0-sha-dbed7d5
    helm:
      parameters:
        - name: image.tag
          value: sha-09a1d0c
      valuesObject:
        route:
          hostnames:
            - api.dev.maxhq.io
        auth:
          issuer: https://login.dev.maxhq.io
          jwksURI: https://login.dev.maxhq.io/keys
        env:
          EMAIL_ENABLED: "true"
          EMAIL_FROM: "Squares <squares@notify.maxhq.io>"
          SMTP_HOST: smtp.zeptomail.com
          WEB_URL: https://squares.dev.maxhq.io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
