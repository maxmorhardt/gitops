apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: squares
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: squares
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: squares
    targetRevision: 0.0.0-sha-b2ca6d8
    helm:
      parameters:
        - name: image.tag
          value: sha-a8ab74e
      valuesObject:
        route:
          hostnames:
            - squares.dev.maxhq.io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
