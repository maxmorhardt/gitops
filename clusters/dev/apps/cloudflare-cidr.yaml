apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-cidr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: cloudflare-cidr
    targetRevision: 0.0.0-sha-50c09e1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
