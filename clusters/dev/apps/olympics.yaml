apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olympics
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: olympics
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: olympics
    targetRevision: 0.0.0-sha-85880c1
    helm:
      parameters:
        - name: image.tag
          value: sha-146c0a5
      valuesObject:
        route:
          hostnames:
            - olympics.dev.maxhq.io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
