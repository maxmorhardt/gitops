apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maxhq
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: maxhq
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: maxhq
    targetRevision: 0.0.0-sha-0075c61
    helm:
      parameters:
        - name: image.tag
          value: sha-7dd00d1
      valuesObject:
        route:
          hostnames:
            - dev.maxhq.io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
