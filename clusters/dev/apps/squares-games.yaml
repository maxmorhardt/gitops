apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: squares-games
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: squares
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: squares-games
    targetRevision: 0.0.0
    helm:
      parameters:
        - name: image.tag
          value: 2.0.0
      valuesObject:
        route:
          hostnames:
            - api.dev.maxhq.io
        auth:
          issuer: https://login.dev.maxhq.io
          jwksURI: https://login.dev.maxhq.io/keys
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
