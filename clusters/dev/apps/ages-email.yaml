apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ages-email
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ages
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: ages-email
    targetRevision: 0.0.0-sha-4bb68ff
    helm:
      valuesObject:
        suspend: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
