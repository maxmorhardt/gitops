apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ages-email
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ages
  source:
    repoURL: git@github.com:maxmorhardt/maxhq-private.git
    path: apps/ages/charts/ages-email
    targetRevision: main
    helm:
      valuesObject:
        suspend: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
