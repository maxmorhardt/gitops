apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: gateway
    targetRevision: 0.0.0-sha-f05880b
    helm:
      valuesObject:
        domain: dev.maxhq.io
        tls:
          secretName: dev.maxhq.io-tls
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
