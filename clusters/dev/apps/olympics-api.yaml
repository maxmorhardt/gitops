apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olympics-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: olympics
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: olympics-api
    targetRevision: 0.0.0-sha-ffd18ea
    helm:
      parameters:
        - name: image.tag
          value: sha-29e6d7c
      valuesObject:
        route:
          hostnames:
            - api.dev.maxhq.io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
