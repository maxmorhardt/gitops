apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ages
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ages
  source:
    repoURL: git@github.com:maxmorhardt/maxhq-private.git
    path: apps/ages/charts/ages
    targetRevision: main
    helm:
      parameters:
        - name: image.tag
          value: 8.2.0
      valuesObject:
        route:
          hostnames:
            - ages.dev.maxhq.io
        auth:
          issuer: https://login.dev.maxhq.io
          authorizationEndpoint: https://login.dev.maxhq.io/auth?connector_id=google
          redirectURL: https://ages.dev.maxhq.io/oauth2/callback
          jwksURI: https://login.dev.maxhq.io/keys
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
