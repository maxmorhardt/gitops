apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ages
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ages
  source:
    repoURL: ghcr.io/maxmorhardt/charts
    chart: ages
    targetRevision: 0.0.0-sha-8b05b47
    helm:
      parameters:
        - name: image.tag
          value: sha-b6d18d2
      valuesObject:
        route:
          hostnames:
            - ages.dev.maxhq.io
        auth:
          issuer: https://login.dev.maxhq.io
          authorizationEndpoint: https://login.dev.maxhq.io/auth?connector_id=google
          redirectURL: https://ages.dev.maxhq.io/oauth2/callback
          jwksURI: https://login.dev.maxhq.io/keys
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
