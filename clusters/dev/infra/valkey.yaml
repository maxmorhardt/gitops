apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: valkey
  # the chart is rendered by kustomize so the acl secret can be mounted; the version is in the kustomization
  source:
    repoURL: https://github.com/maxmorhardt/gitops.git
    targetRevision: main
    path: infrastructure/valkey
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
