apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: valkey
  sources:
    - repoURL: docker.io/cloudpirates
      chart: valkey
      # renovate: datasource=docker depName=docker.io/cloudpirates/valkey
      targetRevision: 0.25.13
      helm:
        valueFiles:
          - $values/valkey/values.yaml
    - repoURL: https://github.com/maxmorhardt/gitops.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
