apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-crds-helm
      # renovate: datasource=docker depName=docker.io/envoyproxy/gateway-crds-helm
      targetRevision: 1.10.0
      helm:
        valueFiles:
          - $values/infra/envoy-gateway/values-crds.yaml
    - repoURL: https://github.com/maxmorhardt/gitops.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
