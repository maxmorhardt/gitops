apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olympics-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: olympics
  source:
    repoURL: git@github.com:maxmorhardt/maxhq-private.git
    path: apps/olympics/api/charts/olympics-api
    targetRevision: main
    helm:
      parameters:
        - name: image.tag
          value: 2.0.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
