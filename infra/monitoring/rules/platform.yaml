apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform
  namespace: monitoring
spec:
  groups:
    - name: platform
      interval: 1m
      rules:
        - alert: MetricsStopped
          expr: absent_over_time(up{job="integrations/kubernetes/kubelet"}[10m])
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No metrics from this cluster for 15 minutes; Alloy, the network, or the whole cluster is down
        - alert: SUCUpgradeRunning
          expr: max_over_time((count(kube_job_created{namespace="system-upgrade"}) or vector(0))[20m:1m]) > 0
          labels:
            severity: none
            namespace: system-upgrade
          annotations:
            summary: k3s node upgrade running
            description: system-upgrade-controller has upgrade jobs in the system-upgrade namespace. Firing means an upgrade started; resolved means all jobs finished.
        - alert: CertificateExpiring
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.name }} expires in under 14 days'
        - alert: Gateway5xxSpike
          expr: sum(rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class="5"}[5m])) / sum(rate(envoy_cluster_upstream_rq_total[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: More than 5% of requests through the gateway are failing
        - alert: PostgresBackupFailed
          expr: cnpg_collector_last_failed_backup_timestamp > cnpg_collector_last_available_backup_timestamp
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: The last Postgres backup failed
        - alert: PostgresBackupStale
          expr: time() - max by (cluster) (cnpg_collector_last_available_backup_timestamp > 0) > 26 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: No Postgres backup in over 26 hours
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.name }} is {{ $labels.health_status }}'
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.name }} has been OutOfSync for 30 minutes'
    - name: services
      interval: 1m
      rules:
        - alert: AppDown
          expr: kube_deployment_status_replicas_available{namespace=~"squares|olympics|maxhq|ages"} == 0 and kube_deployment_spec_replicas{namespace=~"squares|olympics|maxhq|ages"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.deployment }} has no ready pods'
        - alert: ScoresWorkerFailing
          expr: sum by (cluster) (increase(scores_worker_runs_total{namespace="squares", result="error"}[10m])) > 2 unless sum by (cluster) (increase(scores_worker_runs_total{namespace="squares", result="success"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Every squares scores worker run has failed for 15 minutes, so game scores are not updating
        - alert: ScoresWorkerStale
          expr: time() - max by (cluster) (scores_worker_last_success_timestamp_seconds{namespace="squares"}) > 7 * 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The squares scores worker has not finished a run in {{ $value | humanizeDuration }}
        - alert: ValkeyDown
          expr: (sum by (cluster) (redis_up{namespace="valkey"}) or sum by (cluster) (kube_statefulset_replicas{namespace="valkey"}) * 0) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No Valkey instance is up, so squares caches and event streams are down
        - alert: ValkeyInstanceDown
          expr: redis_up{namespace="valkey"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.pod }} is down'
        - alert: ValkeyMemoryHigh
          expr: redis_memory_used_bytes{namespace="valkey"} / redis_memory_max_bytes{namespace="valkey"} > 0.9 and redis_memory_max_bytes{namespace="valkey"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.pod }} is using {{ $value | humanizePercentage }} of its maxmemory'
    - name: hardware
      interval: 1m
      rules:
        - alert: NodeTemperatureHigh
          expr: max by (cluster, instance) (node_hwmon_temp_celsius{chip=~"thermal.*"}) > 75
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.instance }} CPU is at {{ $value | printf "%.0f" }}°C; Pis throttle around 80°C'
