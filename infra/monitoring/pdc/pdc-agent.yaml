apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdc-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pdc-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pdc-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdc-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 30000
        runAsGroup: 30000
        fsGroup: 30000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pdc-agent
      containers:
        - name: pdc-agent
          image: grafana/pdc-agent:0.0.67
          args:
            - -token
            - $(TOKEN)
            - -cluster
            - prod-us-east-0
            - -gcloud-hosted-grafana-id
            - '1880852'
            - -use-gossh
            - -permit-domains
            - postgres-cluster-ro.cnpg-database.svc.cluster.local
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: pdc-agent
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ssh
              mountPath: /home/pdc/.ssh
      volumes:
        - name: ssh
          emptyDir: {}
