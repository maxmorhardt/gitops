apiVersion: v1
kind: Secret
metadata:
  name: valkey-users
  namespace: valkey
type: Opaque
stringData:
  default: "CHANGE-ME"
  squares: "CHANGE-ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-acl
  namespace: valkey
type: Opaque
stringData:
  users.conf: "user squares on #<sha256 of the squares password> ~squares:* resetchannels +@all -@dangerous"
