name: infra CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-charts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: argo/argo-cd
            # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
            chart_version: '10.10.5'
            helm_repo_name: argo
            helm_repo_url: https://argoproj.github.io/argo-helm
            values_files: infrastructure/argocd/values.yaml
          - chart: dex/dex
            # renovate: datasource=helm depName=dex registryUrl=https://charts.dexidp.io
            chart_version: '0.26.0'
            helm_repo_name: dex
            helm_repo_url: https://charts.dexidp.io
            values_files: infrastructure/dex/values.yaml
          - chart: oci://docker.io/envoyproxy/gateway-helm
            # renovate: datasource=docker depName=docker.io/envoyproxy/gateway-helm
            chart_version: '1.9.2'
            values_files: infrastructure/envoy-gateway/values.yaml
          - chart: kubereboot/kured
            # renovate: datasource=helm depName=kured registryUrl=https://kubereboot.github.io/charts
            chart_version: '6.1.0'
            helm_repo_name: kubereboot
            helm_repo_url: https://kubereboot.github.io/charts
            values_files: infrastructure/kured/values.yaml
          - chart: oci://docker.io/cloudpirates/valkey
            # renovate: datasource=docker depName=docker.io/cloudpirates/valkey
            chart_version: '0.25.13'
            values_files: infrastructure/valkey/values.yaml
          - chart: cnpg/cloudnative-pg
            # renovate: datasource=helm depName=cloudnative-pg registryUrl=https://cloudnative-pg.github.io/charts
            chart_version: '0.29.1'
            helm_repo_name: cnpg
            helm_repo_url: https://cloudnative-pg.github.io/charts
            values_files: infrastructure/postgres/values-operator.yaml
          - chart: cnpg/cluster
            # renovate: datasource=helm depName=cluster registryUrl=https://cloudnative-pg.github.io/charts
            chart_version: '0.9.0'
            helm_repo_name: cnpg
            helm_repo_url: https://cloudnative-pg.github.io/charts
            values_files: infrastructure/postgres/values-cluster.yaml
          - chart: sealed-secrets/sealed-secrets
            # renovate: datasource=helm depName=sealed-secrets registryUrl=https://bitnami.github.io/sealed-secrets
            chart_version: '2.20.0'
            helm_repo_name: sealed-secrets
            helm_repo_url: https://bitnami.github.io/sealed-secrets
            values_files: infrastructure/sealed-secrets/values.yaml
          - chart: argo/argo-cd
            # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
            chart_version: '10.10.5'
            helm_repo_name: argo
            helm_repo_url: https://argoproj.github.io/argo-helm
            values_files: |
              infrastructure/argocd/values.yaml
              infrastructure/argocd/values-dev.yaml
          - chart: dex/dex
            # renovate: datasource=helm depName=dex registryUrl=https://charts.dexidp.io
            chart_version: '0.26.0'
            helm_repo_name: dex
            helm_repo_url: https://charts.dexidp.io
            values_files: |
              infrastructure/dex/values.yaml
              infrastructure/dex/values-dev.yaml
          - chart: cnpg/cluster
            # renovate: datasource=helm depName=cluster registryUrl=https://cloudnative-pg.github.io/charts
            chart_version: '0.9.0'
            helm_repo_name: cnpg
            helm_repo_url: https://cloudnative-pg.github.io/charts
            values_files: |
              infrastructure/postgres/values-cluster.yaml
              infrastructure/postgres/values-cluster-dev.yaml
          - chart: grafana/k8s-monitoring
            # renovate: datasource=helm depName=k8s-monitoring registryUrl=https://grafana.github.io/helm-charts
            chart_version: '4.5.3'
            helm_repo_name: grafana
            helm_repo_url: https://grafana.github.io/helm-charts
            values_files: |
              infrastructure/monitoring/values.yaml
              infrastructure/monitoring/values-prod.yaml
          - chart: grafana/k8s-monitoring
            # renovate: datasource=helm depName=k8s-monitoring registryUrl=https://grafana.github.io/helm-charts
            chart_version: '4.5.3'
            helm_repo_name: grafana
            helm_repo_url: https://grafana.github.io/helm-charts
            values_files: |
              infrastructure/monitoring/values.yaml
              infrastructure/monitoring/values-dev.yaml
          - chart: jetstack/cert-manager
            # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
            chart_version: 'v1.21.2'
            helm_repo_name: jetstack
            helm_repo_url: https://charts.jetstack.io
            values_files: infrastructure/cert-manager/values.yaml
    uses: maxmorhardt/workflows/.github/workflows/validate-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart: ${{ matrix.chart }}
      chart_version: ${{ matrix.chart_version }}
      helm_repo_name: ${{ matrix.helm_repo_name }}
      helm_repo_url: ${{ matrix.helm_repo_url }}
      values_files: ${{ matrix.values_files }}
      lint: false

  validate-manifests:
    uses: maxmorhardt/workflows/.github/workflows/validate-manifests.yml@main
    with:
      repository: ${{ github.repository }}
      manifests: |
        clusters/prod
        clusters/dev
        infrastructure/cert-manager/manifests
        infrastructure/system-upgrade-controller/plans.yaml
        infrastructure/storage/local-path-retain.yaml

  validate-complete:
    name: Validate Complete
    if: always()
    needs: [validate-charts, validate-manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all validations succeeded
        env:
          CHARTS: ${{ needs.validate-charts.result }}
          MANIFESTS: ${{ needs.validate-manifests.result }}
        run: |
          echo "validate-charts=$CHARTS validate-manifests=$MANIFESTS"
          if [ "$CHARTS" != "success" ] || [ "$MANIFESTS" != "success" ]; then
            echo "a required validation did not succeed"
            exit 1
          fi
